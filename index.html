                    <div class="contact-field">

                        <input type="text" name="name" id="fieldName" required placeholder="">
                        <p class="field-error" id="errorName"></p>
                    </div>
                    <div class="contact-field">
                        <label data-i18n="label-email"></label>
                        <input type="email" name="email" id="fieldEmail" required placeholder="">
                        <p class="field-error" id="errorEmail"></p>
                    </div>
                </div>
                <div class="contact-field">
                    <label data-i18n="label-message"></label>
                    <textarea name="message" id="fieldMessage" rows="6" required></textarea>
                    <p class="field-error" id="errorMessage"></p>
                </div>
                <div class="contact-privacy">
                    <input type="checkbox" id="privacy" required>
                    <label for="privacy" data-i18n="privacy-text"></label>
                </div>
                <div class="contact-submit">
                    <button type="submit" data-i18n="btn-send"></button>
                </div>
                <p class="form-success" id="formSuccess" style="display:none;" data-i18n="form-success"></p>
