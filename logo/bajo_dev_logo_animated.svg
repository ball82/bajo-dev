<svg width="680" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes drawBracketL {
        from { stroke-dashoffset: 400; opacity: 0; }
        to   { stroke-dashoffset: 0;   opacity: 1; }
      }
      @keyframes drawBracketR {
        from { stroke-dashoffset: 400; opacity: 0; }
        to   { stroke-dashoffset: 0;   opacity: 1; }
      }
      @keyframes fadeInBajo {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeInDev {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes popDot {
        from { r: 0; opacity: 0; }
        60%  { r: 10px; opacity: 1; }
        to   { r: 7px; opacity: 1; }
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 400; opacity: 0; }
        to   { stroke-dashoffset: 0;   opacity: 1; }
      }
      @keyframes fadeInSub {
        from { opacity: 0; letter-spacing: 8px; }
        to   { opacity: 1; letter-spacing: 3px; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 7px; }
        50%       { r: 9px; }
      }

      .bracket-l {
        fill: none;
        stroke: rgb(127, 119, 221);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        opacity: 0;
        animation: drawBracketL 0.6s cubic-bezier(.4,0,.2,1) 0.2s forwards;
      }
      .bracket-r {
        fill: none;
        stroke: rgb(127, 119, 221);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        opacity: 0;
        animation: drawBracketR 0.6s cubic-bezier(.4,0,.2,1) 0.5s forwards;
      }
      .text-bajo {
        fill: rgb(240, 238, 248);
        font-family: Syne, "Arial Black", sans-serif;
        font-size: 108px;
        font-weight: 800;
        letter-spacing: -2px;
        opacity: 0;
        animation: fadeInBajo 0.55s cubic-bezier(.4,0,.2,1) 0.85s forwards;
      }
      .text-dev {
        fill: rgb(127, 119, 221);
        font-family: Syne, "Arial Black", sans-serif;
        font-size: 108px;
        font-weight: 800;
        letter-spacing: -2px;
        opacity: 0;
        animation: fadeInDev 0.55s cubic-bezier(.4,0,.2,1) 1.1s forwards;
      }
      .dot-circle {
        fill: rgb(239, 159, 39);
        opacity: 0;
        animation: popDot 0.5s cubic-bezier(.4,0,.2,1) 1.35s forwards,
                   pulseDot 2.4s ease-in-out 1.85s infinite;
      }
      .divider-line {
        stroke: rgb(127, 119, 221);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        opacity: 0;
        animation: drawLine 0.5s cubic-bezier(.4,0,.2,1) 1.6s forwards;
      }
      .sub-text {
        fill: rgb(156, 154, 146);
        font-family: "Space Mono", monospace;
        font-size: 12px;
        text-anchor: middle;
        opacity: 0;
        animation: fadeInSub 0.7s cubic-bezier(.4,0,.2,1) 1.9s forwards;
      }
    </style>

    <mask id="imagine-text-gaps-anim" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="680" height="300" fill="white"/>
      <rect x="170" y="61.36" width="297.31" height="155.92" fill="black" rx="2"/>
      <rect x="411" y="61.36" width="223.47" height="155.92" fill="black" rx="2"/>
      <rect x="238.87" y="226.91" width="202.26" height="17.99" fill="black" rx="2"/>
    </mask>
  </defs>

  <!-- Left bracket -->
  <path class="bracket-l" d="M160 70 L136 70 L136 230 L160 230"/>

  <!-- Right bracket -->
  <path class="bracket-r" d="M520 70 L544 70 L544 230 L520 230" mask="url(#imagine-text-gaps-anim)"/>

  <!-- BaJo text -->
  <text class="text-bajo" x="174" y="182">BaJo</text>

  <!-- Orange dot -->
  <circle class="dot-circle" cx="399" cy="155" r="7"/>

  <!-- Dev text -->
  <text class="text-dev" x="415" y="182">Dev</text>

  <!-- Divider line -->
  <line class="divider-line" x1="160" y1="206" x2="520" y2="206" mask="url(#imagine-text-gaps-anim)"/>

  <!-- Subtitle -->
  <text class="sub-text" x="340" y="240">FULLSTACK DEVELOPER</text>
</svg>
